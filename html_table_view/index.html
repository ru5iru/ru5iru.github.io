<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Table Renderer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 150px;
      margin-bottom: 15px;
      font-family: monospace;
    }
    .table-container {
      margin-top: 20px;
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #444;
      padding: 5px 10px;
      text-align: left;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>

  <h2>Paste your HTML Table</h2>

  <!-- Input field for HTML table -->
  <textarea id="tableInput" placeholder="Paste your HTML table here..."></textarea>

  <!-- Button to render -->
  <button onclick="renderTable()">Render Table</button>

  <!-- Table display -->
  <div class="table-container" id="tableOutput"></div>

  <script>
    function renderTable() {
      const input = document.getElementById('tableInput').value;
      const output = document.getElementById('tableOutput');

      // Simple safety check: only allow <table> content
      if (input.toLowerCase().includes("<table")) {
        output.innerHTML = input;
      } else {
        output.innerHTML = "<p style='color:red;'>⚠️ Please paste a valid HTML table.</p>";
      }
    }
  </script>

</body>
</html>
