<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Spreadsheet Table Renderer</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg-primary: #ffffff;
				--bg-secondary: #f8f9fa;
				--border-color: #e1e5e9;
				--text-primary: #333333;
				--text-secondary: #666666;
				--header-bg: #f1f3f5;
				--hover-bg: #f8f9fa;
				--accent: #0066cc;
			}

			[data-theme="dark"] {
				--bg-primary: #1a1d23;
				--bg-secondary: #242831;
				--border-color: #3d4047;
				--text-primary: #e1e5e9;
				--text-secondary: #a0a4a8;
				--header-bg: #2d3139;
				--hover-bg: #323741;
				--accent: #4a9eff;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background: var(--bg-secondary);
				color: var(--text-primary);
				font-size: 13px;
				line-height: 1.4;
			}

			.container {
				max-width: 100vw;
				margin: 0;
				background: var(--bg-primary);
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}

			.header {
				padding: 15px 20px;
				background: var(--bg-primary);
				border-bottom: 1px solid var(--border-color);
				flex-shrink: 0;
			}

			.title {
				font-size: 18px;
				font-weight: 600;
				color: var(--text-primary);
				margin-bottom: 15px;
			}

			.input-section {
				display: flex;
				gap: 10px;
				align-items: flex-end;
				flex-wrap: wrap;
			}

			.input-group {
				flex: 1;
				min-width: 300px;
			}

			.input-label {
				display: block;
				margin-bottom: 5px;
				font-weight: 500;
				color: var(--text-secondary);
				font-size: 12px;
			}

			textarea {
				width: 100%;
				height: 80px;
				padding: 8px 12px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace;
				font-size: 12px;
				background: var(--bg-primary);
				color: var(--text-primary);
				resize: vertical;
				transition: border-color 0.2s ease;
			}

			textarea:focus {
				outline: none;
				border-color: var(--accent);
			}

			.controls {
				display: flex;
				gap: 8px;
				align-items: flex-end;
			}

			button {
				padding: 8px 16px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-size: 12px;
				cursor: pointer;
				transition: all 0.2s ease;
				background: var(--bg-primary);
				color: var(--text-primary);
				font-weight: 500;
				height: 32px;
				display: flex;
				align-items: center;
				gap: 6px;
			}

			.btn-primary {
				background: var(--accent);
				color: white;
				border-color: var(--accent);
			}

			button:hover {
				background: var(--hover-bg);
			}

			.btn-primary:hover {
				background: var(--accent);
				opacity: 0.9;
			}

			.theme-toggle {
				margin-left: auto;
			}

			.main-content {
				flex: 1;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}

			.message-container {
				padding: 0 20px;
				margin-top: 10px;
			}

			.table-container {
				flex: 1;
				overflow: auto;
				margin: 10px 20px 20px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				background: var(--bg-primary);
			}

			.table-wrapper {
				width: 100%;
				height: 100%;
				overflow: auto;
			}

			table {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0;
				font-size: 12px;
				background: var(--bg-primary);
			}

			th,
			td {
				padding: 8px 12px;
				border-right: 1px solid var(--border-color);
				border-bottom: 1px solid var(--border-color);
				text-align: left;
				vertical-align: top;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				min-width: 60px;
				max-width: 300px;
			}

			th {
				background: var(--header-bg);
				font-weight: 600;
				position: sticky;
				top: 0;
				z-index: 10;
				color: var(--text-primary);
			}

			td {
				background: var(--bg-primary);
			}

			tr:hover td {
				background: var(--hover-bg);
			}

			th:first-child,
			td:first-child {
				border-left: none;
			}

			th:last-child,
			td:last-child {
				border-right: none;
			}

			.auto-width {
				width: auto;
				white-space: normal;
				word-wrap: break-word;
			}

			.expand-content th,
			.expand-content td {
				white-space: normal;
				max-width: none;
				width: auto;
			}

			.error-message,
			.success-message {
				padding: 8px 12px;
				border-radius: 4px;
				font-size: 12px;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.error-message {
				background: #fff5f5;
				color: #c53030;
				border: 1px solid #feb2b2;
			}

			.success-message {
				background: #f0fff4;
				color: #38a169;
				border: 1px solid #9ae6b4;
			}

			[data-theme="dark"] .error-message {
				background: #2d1b1b;
				color: #fc8181;
				border-color: #742a2a;
			}

			[data-theme="dark"] .success-message {
				background: #1a2e1a;
				color: #68d391;
				border-color: #276749;
			}

			.stats {
				display: flex;
				gap: 15px;
				margin-top: 8px;
				font-size: 11px;
				color: var(--text-secondary);
			}

			.hidden {
				display: none;
			}

			.checkbox-group {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 12px;
			}

			input[type="checkbox"] {
				margin: 0;
			}

			@media (max-width: 768px) {
				.input-section {
					flex-direction: column;
					align-items: stretch;
				}

				.input-group {
					min-width: 100%;
				}

				.controls {
					justify-content: stretch;
				}

				button {
					flex: 1;
					justify-content: center;
				}
			}
		</style>
	</head>
	<body data-theme="light">
		<div class="container">
			<div class="header">
				<div class="title">📊 Table Renderer</div>

				<div class="input-section">
					<div class="input-group">
						<label class="input-label" for="tableInput"> HTML Table Code </label>
						<textarea
							id="tableInput"
							placeholder="<table><tr><th>Name</th><th>Age</th></tr><tr><td>John</td><td>30</td></tr></table>"
						></textarea>
					</div>

					<div class="controls">
						<button class="btn-primary" onclick="renderTable()">Render</button>

						<button onclick="clearInput()">Clear</button>

						<button onclick="copyTableData()">📋 Copy Data</button>

						<div class="checkbox-group">
							<input type="checkbox" id="expandContent" onchange="toggleExpand()" />
							<label for="expandContent">Expand</label>
						</div>

						<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
					</div>
				</div>
			</div>

			<div class="main-content">
				<div id="messageContainer" class="message-container"></div>

				<div class="table-container hidden" id="tableContainer">
					<div class="table-wrapper" id="tableOutput"></div>
					<div class="stats" id="statsContainer"></div>
				</div>
			</div>
		</div>

		<script>
			let currentTableData = null;

			function renderTable() {
				const input = document.getElementById("tableInput").value.trim();
				const output = document.getElementById("tableOutput");
				const container = document.getElementById("tableContainer");
				const messageContainer = document.getElementById("messageContainer");

				messageContainer.innerHTML = "";

				if (!input) {
					showMessage("Please paste some HTML table code first.", "error");
					container.classList.add("hidden");
					return;
				}

				try {
					if (!isValidTableHTML(input)) {
						showMessage("Please paste valid HTML table code.", "error");
						container.classList.add("hidden");
						return;
					}

					const sanitizedHTML = sanitizeHTML(input);
					output.innerHTML = sanitizedHTML;

					// Auto-size columns based on content
					adjustColumnWidths();

					// Extract table data for copying
					extractTableData();

					container.classList.remove("hidden");
					showMessage("Table rendered successfully!", "success");
					updateStats(output);
				} catch (error) {
					showMessage("Error rendering table: " + error.message, "error");
					container.classList.add("hidden");
				}
			}

			function isValidTableHTML(html) {
				const lowercaseHTML = html.toLowerCase();
				return (
					lowercaseHTML.includes("<table") &&
					(lowercaseHTML.includes("<td") || lowercaseHTML.includes("<th")) &&
					lowercaseHTML.includes("<tr")
				);
			}

			function sanitizeHTML(html) {
				const tempDiv = document.createElement("div");
				tempDiv.innerHTML = html;

				const allowedTags = [
					"table",
					"thead",
					"tbody",
					"tfoot",
					"tr",
					"th",
					"td",
					"caption",
				];
				const elements = tempDiv.querySelectorAll("*");

				elements.forEach((element) => {
					if (!allowedTags.includes(element.tagName.toLowerCase())) {
						element.remove();
					}
				});

				return tempDiv.innerHTML;
			}

			function adjustColumnWidths() {
				const tables = document.querySelectorAll("#tableOutput table");

				tables.forEach((table) => {
					const rows = table.querySelectorAll("tr");
					if (rows.length === 0) return;

					// Get number of columns from first row
					const firstRow = rows[0];
					const colCount = firstRow.children.length;

					// Calculate max content width for each column
					const colWidths = new Array(colCount).fill(0);

					rows.forEach((row) => {
						Array.from(row.children).forEach((cell, index) => {
							const content = cell.textContent.trim();
							const width = Math.min(Math.max(content.length * 8 + 24, 80), 300);
							colWidths[index] = Math.max(colWidths[index], width);
						});
					});

					// Apply calculated widths
					rows.forEach((row) => {
						Array.from(row.children).forEach((cell, index) => {
							cell.style.width = colWidths[index] + "px";
							cell.style.minWidth = colWidths[index] + "px";
						});
					});
				});
			}

			function extractTableData() {
				const tables = document.querySelectorAll("#tableOutput table");
				currentTableData = [];

				tables.forEach((table) => {
					const rows = table.querySelectorAll("tr");
					const tableData = [];

					rows.forEach((row) => {
						const rowData = [];
						row.querySelectorAll("th, td").forEach((cell) => {
							rowData.push(cell.textContent.trim());
						});
						if (rowData.length > 0) {
							tableData.push(rowData);
						}
					});

					if (tableData.length > 0) {
						currentTableData.push(tableData);
					}
				});
			}

			function copyTableData() {
				if (!currentTableData || currentTableData.length === 0) {
					showMessage("No table data to copy. Please render a table first.", "error");
					return;
				}

				// Convert table data to tab-separated values (TSV) for spreadsheet compatibility
				let tsvContent = "";

				currentTableData.forEach((tableData, tableIndex) => {
					if (tableIndex > 0) tsvContent += "\n\n"; // Separate multiple tables

					tableData.forEach((row) => {
						tsvContent += row.join("\t") + "\n";
					});
				});

				navigator.clipboard
					.writeText(tsvContent.trim())
					.then(() => {
						showMessage(
							"Table data copied! You can paste it directly into spreadsheet applications.",
							"success"
						);
					})
					.catch(() => {
						// Fallback for older browsers
						const textArea = document.createElement("textarea");
						textArea.value = tsvContent.trim();
						document.body.appendChild(textArea);
						textArea.select();
						document.execCommand("copy");
						document.body.removeChild(textArea);
						showMessage("Table data copied to clipboard!", "success");
					});
			}

			function toggleExpand() {
				const output = document.getElementById("tableOutput");
				const checkbox = document.getElementById("expandContent");

				if (checkbox.checked) {
					output.classList.add("expand-content");
				} else {
					output.classList.remove("expand-content");
					adjustColumnWidths(); // Reapply auto-sizing
				}
			}

			function toggleTheme() {
				const body = document.body;
				const button = document.querySelector(".theme-toggle");

				if (body.getAttribute("data-theme") === "light") {
					body.setAttribute("data-theme", "dark");
					button.textContent = "☀️";
				} else {
					body.setAttribute("data-theme", "light");
					button.textContent = "🌙";
				}
			}

			function clearInput() {
				document.getElementById("tableInput").value = "";
				document.getElementById("tableContainer").classList.add("hidden");
				document.getElementById("messageContainer").innerHTML = "";
				currentTableData = null;
			}

			function showMessage(text, type) {
				const messageContainer = document.getElementById("messageContainer");
				const messageClass = type === "error" ? "error-message" : "success-message";

				messageContainer.innerHTML = `
        <div class="${messageClass}">
          <span>${text}</span>
        </div>
      `;

				if (type === "success") {
					setTimeout(() => {
						messageContainer.innerHTML = "";
					}, 3000);
				}
			}

			function updateStats(output) {
				const tables = output.querySelectorAll("table");
				const statsContainer = document.getElementById("statsContainer");

				if (tables.length === 0) {
					statsContainer.innerHTML = "";
					return;
				}

				let totalRows = 0;
				let totalCells = 0;

				tables.forEach((table) => {
					const rows = table.querySelectorAll("tr");
					const cells = table.querySelectorAll("td, th");
					totalRows += rows.length;
					totalCells += cells.length;
				});

				statsContainer.innerHTML = `
        <span>Tables: ${tables.length}</span>
        <span>Rows: ${totalRows}</span>
        <span>Cells: ${totalCells}</span>
      `;
			}

			// Keyboard shortcuts
			document.addEventListener("keydown", function (e) {
				if (e.ctrlKey || e.metaKey) {
					switch (e.key) {
						case "Enter":
							e.preventDefault();
							renderTable();
							break;
						case "k":
							e.preventDefault();
							clearInput();
							break;
					}
				}
			});
		</script>
	</body>
</html>
